{% extends "base.html" %}
{% block content %}
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Gestión de Clientes</h1>
        <a href="{{ url_for('nuevo_cliente') }}" class="btn btn-success">+ Nuevo Cliente</a>
    </div>
    <table>
        <tr><th>Nombre</th><th>RUT</th><th>Teléfono</th><th>Email</th></tr>
        {% for c in clientes %}
        <tr>
            <td>{{ c.nombre }}</td>
            <td>{{ c.rut or '—' }}</td>
            <td>{{ c.telefono or '—' }}</td>
            <td>{{ c.email or '—' }}</td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
