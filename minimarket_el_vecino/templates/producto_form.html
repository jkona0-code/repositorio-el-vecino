{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:600px; margin:0 auto;">
    <h1>{{ 'Editar' if producto else 'Nuevo' }} Producto</h1>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="form-group">
            <label>Código</label>
            <input type="text" name="codigo" required maxlength="20"
                   value="{{ producto.codigo if producto else '' }}">
        </div>
        <div class="form-group">
            <label>Nombre</label>
            <input type="text" name="nombre" required maxlength="100"
                   value="{{ producto.nombre if producto else '' }}">
        </div>
        <div class="form-group">
            <label>Precio (CLP)</label>
            <input type="number" name="precio" required min="1"
                   value="{{ producto.precio if producto else '' }}">
        </div>
        <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" required min="0"
                   value="{{ producto.stock if producto else '0' }}">
        </div>
        <div class="form-group">
            <label>Categoría</label>
            <select name="categoria">
                {% for cat in ['General', 'Abarrotes', 'Lácteos', 'Bebidas', 'Panadería', 'Limpieza'] %}
                <option value="{{ cat }}" {% if producto and producto.categoria == cat %}selected{% endif %}>
                    {{ cat }}
                </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{{ url_for('productos') }}" class="btn btn-primary">Cancelar</a>
    </form>
</div>
{% endblock %}
