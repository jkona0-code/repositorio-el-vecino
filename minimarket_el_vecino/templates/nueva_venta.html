{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Registrar Nueva Venta</h1>
    <form method="POST" id="ventaForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label>Cliente (opcional)</label>
            <select name="cliente_id">
                <option value="">— Sin cliente —</option>
                {% for c in clientes %}
                <option value="{{ c.id }}">{{ c.nombre }} ({{ c.rut }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Método de pago</label>
            <select name="metodo_pago">
                <option value="efectivo">Efectivo</option>
                <option value="tarjeta">Tarjeta</option>
            </select>
        </div>

        <h2>Productos</h2>
        <div id="items">
            <div class="venta-item">
                <div class="form-group">
                    <label>Producto</label>
                    <select name="producto_id[]" required onchange="actualizarPrecio(this)">
                        <option value="">Seleccionar...</option>
                        {% for p in productos %}
                        <option value="{{ p.id }}" data-precio="{{ p.precio }}" data-stock="{{ p.stock }}">
                            {{ p.nombre }} — ${{ '{:,.0f}'.format(p.precio) }} (Stock: {{ p.stock }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" name="cantidad[]" min="1" value="1" required
                           onchange="calcularTotal()">
                </div>
                <div class="form-group">
                    <label>Subtotal</label>
                    <input type="text" class="subtotal" readonly value="$0">
                </div>
                <button type="button" class="btn btn-danger btn-sm" onclick="eliminarItem(this)"
                        style="margin-bottom:16px;">✕</button>
            </div>
        </div>

        <button type="button" class="btn btn-primary" onclick="agregarItem()"
                style="margin-bottom:20px;">+ Agregar Producto</button>

        <div style="text-align:right; font-size:1.4rem; margin-bottom:20px; color:#1a5276;">
            <strong>Total: <span id="totalVenta">$0</span></strong>
        </div>

        <button type="submit" class="btn btn-success" style="width:100%; font-size:1.1rem;">
            ✓ Confirmar Venta
        </button>
    </form>
</div>

<script>
function agregarItem() {
    const items = document.getElementById('items');
    const first = items.querySelector('.venta-item');
    const clone = first.cloneNode(true);
    clone.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    clone.querySelector('input[type=number]').value = 1;
    clone.querySelector('.subtotal').value = '$0';
    items.appendChild(clone);
}

function eliminarItem(btn) {
    const items = document.getElementById('items');
    if (items.children.length > 1) {
        btn.closest('.venta-item').remove();
        calcularTotal();
    }
}

function actualizarPrecio(sel) {
    calcularTotal();
}

function calcularTotal() {
    let total = 0;
    document.querySelectorAll('.venta-item').forEach(item => {
        const sel = item.querySelector('select[name="producto_id[]"]');
        const qty = parseInt(item.querySelector('input[type=number]').value) || 0;
        const opt = sel.options[sel.selectedIndex];
        const precio = parseInt(opt?.dataset?.precio) || 0;
        const sub = precio * qty;
        item.querySelector('.subtotal').value = '$' + sub.toLocaleString('es-CL');
        total += sub;
    });
    document.getElementById('totalVenta').textContent = '$' + total.toLocaleString('es-CL');
}
</script>
{% endblock %}
